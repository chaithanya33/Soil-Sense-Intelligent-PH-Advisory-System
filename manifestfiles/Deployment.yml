apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soil
  template:
    metadata:
      labels:
        app: soil
    spec:
      containers:
        - name: cont1
          image: chaithanya2/soil:
          ports:
            - containerPort: 80