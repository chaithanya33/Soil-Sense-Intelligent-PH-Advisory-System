apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soil
  template:
    metadata:
      labels:
        app: soil
    spec:
      containers:
        - name: cont1
          image: 337040980959.dkr.ecr.ap-southeast-1.amazonaws.com/soil-sense:latest
          ports:
            - containerPort: 80
